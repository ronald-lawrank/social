{% set split = {'4x5': 0.42, '1x1': 0.44, '9x16': 0.46}[S.key] %}
{% set top = (S.h * split)|int %}
{{ frame('light') }}
  <div class="safe" style="left:{{S.safe[3]}}px;right:{{S.safe[1]}}px;top:{{S.safe[0]}}px;height:{{ top - S.safe[0] - 40 }}px">
    <div class="footer"><div class="tag tag-myth" data-slot="label" data-role="label">{{ c.get('label') or 'Myth' }}</div>{{ logo(210, 'dark') }}</div>
    <div class="grow"></div>
    <div class="h2 myth" data-slot="myth" data-role="headline">{{ c.myth }}</div>
  </div>
  <div class="fact-panel" style="top:{{top}}px;{{ tvars('dark') }};background:var(--bg);color:var(--fg)">
    <div class="safe" style="left:{{S.safe[3]}}px;right:{{S.safe[1]}}px;top:60px;bottom:{{S.safe[2]}}px">
      <div class="tag tag-fact">Fact</div>
      <div class="h2" data-slot="fact" data-role="headline" style="margin-top:30px">{{ c.fact|accent(c.get('accent')) }}</div>
      <div class="grow"></div>
      <div class="site" data-slot="site" data-role="label">{{ site }}</div>
    </div>
  </div>
</div>
